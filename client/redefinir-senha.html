<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha – CampusLost</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a class="marca" href="/">CampusLost</a>
    <nav>
      <a href="/itens.html">Itens encontrados</a>
      <a href="/novo-item.html">Registrar item</a>
      <a href="/minhas-reivindicacoes.html">Minhas reivindicações</a>
      <a href="/admin.html">Administração</a>
      <a href="/login.html">Entrar</a>
    </nav>
  </header>

  <main>
    <h1>Criar nova senha</h1>
    <form class="cartao" id="formulario">
      <label for="senha">Nova senha</label>
      <input type="password" id="senha" name="senha" required minlength="8" autocomplete="new-password">
      <label for="confirmacao">Repita a nova senha</label>
      <input type="password" id="confirmacao" name="confirmacao" required minlength="8" autocomplete="new-password">
      <button type="submit">Salvar senha</button>
      <p id="aviso" role="status"></p>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/menu.js"></script>
  <script>
    // RF01.6: o token chega no link do e-mail (?token=...)
    const token = new URLSearchParams(location.search).get('token');
    const formulario = document.getElementById('formulario');
    const aviso = document.getElementById('aviso');

    function mostrar(texto, ehErro) {
      aviso.textContent = texto;
      aviso.className = ehErro ? 'erro' : '';
    }

    if (!token) {
      mostrar('Link incompleto. Abra o link exatamente como chegou no e-mail.', true);
      formulario.querySelector('button').disabled = true;
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      if (formulario.senha.value !== formulario.confirmacao.value) {
        return mostrar('As duas senhas não são iguais.', true);
      }
      try {
        const d = await api('/auth/redefinir-senha', { method: 'POST', body: { token, senha: formulario.senha.value } });
        formulario.reset();
        formulario.querySelector('button').disabled = true;
        aviso.innerHTML = '';
        aviso.append(d.mensagem + ' ');
        const link = document.createElement('a');
        link.href = '/login.html';
        link.textContent = 'Ir para o login';
        aviso.append(link);
      } catch (erro) {
        mostrar(erro.message, true);
      }
    });
  </script>
</body>
</html>
