<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha – CampusLost</title>
  <link rel="icon" href="/img/undb.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="pagina-acesso">
  <div class="fundo-acesso" aria-hidden="true">
    <div class="mancha mancha-1"></div>
    <div class="mancha mancha-2"></div>
    <div class="mancha mancha-3"></div>
    <div class="bolinha bolinha-1"></div>
    <div class="bolinha bolinha-2"></div>
    <svg class="setas setas-1" viewBox="0 0 220 120"><polyline points="4,6 64,60 4,114"/><polyline points="74,6 134,60 74,114"/><polyline points="144,6 204,60 144,114"/></svg>
    <svg class="setas setas-2" viewBox="0 0 220 120"><polyline points="4,6 64,60 4,114"/><polyline points="74,6 134,60 74,114"/><polyline points="144,6 204,60 144,114"/></svg>
    <svg class="setas setas-3" viewBox="0 0 220 120"><polyline points="4,6 64,60 4,114"/><polyline points="74,6 134,60 74,114"/><polyline points="144,6 204,60 144,114"/></svg>
    <svg class="setas setas-4" viewBox="0 0 220 120"><polyline points="4,6 64,60 4,114"/><polyline points="74,6 134,60 74,114"/><polyline points="144,6 204,60 144,114"/></svg>
  </div>

  <main class="acesso">
    <div class="acesso-cartao">
      <form class="acesso-principal" id="formulario" novalidate>
        <a class="logo-acesso" href="/login.html">
          <img src="/img/undb.png" alt="UNDB">
          <div>
            <span class="logo-nome">CampusLost</span>
            <span class="logo-sub">Achados e Perdidos</span>
          </div>
        </a>

        <h1>Criar nova senha</h1>
        <p class="explicacao">Escolha uma senha com pelo menos 8 caracteres.</p>

        <label for="senha">Nova senha</label>
        <input type="password" id="senha" name="senha" required minlength="8" autocomplete="new-password" autofocus>
        <label for="confirmacao">Repita a nova senha</label>
        <input type="password" id="confirmacao" name="confirmacao" required minlength="8" autocomplete="new-password">

        <p id="aviso" class="aviso-acesso" role="status"></p>
        <button type="submit">Salvar senha</button>
      </form>

      <aside class="acesso-lado">
        <h2>Lembrou a senha?</h2>
        <p>Se não precisar mais trocar, é só entrar normalmente.</p>
        <a class="botao botao-contorno" href="/login.html">Entrar</a>
        <p>O link do e-mail vale por 60 minutos e só pode ser usado uma vez.</p>
      </aside>
    </div>
    <p class="rodape-acesso">Achados e Perdidos · UNDB</p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // RF01.6: o token chega no link do e-mail (?token=...)
    const token = new URLSearchParams(location.search).get('token');
    const formulario = document.getElementById('formulario');
    const aviso = document.getElementById('aviso');

    function mostrar(texto, ehErro) {
      aviso.textContent = texto;
      aviso.className = 'aviso-acesso' + (ehErro ? ' erro' : '');
    }

    if (!token) {
      mostrar('Link incompleto. Abra o link exatamente como chegou no e-mail.', true);
      formulario.querySelector('button').disabled = true;
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      if (formulario.senha.value.length < 8) {
        return mostrar('A senha precisa ter pelo menos 8 caracteres.', true);
      }
      if (formulario.senha.value !== formulario.confirmacao.value) {
        return mostrar('As duas senhas não são iguais.', true);
      }
      try {
        const d = await api('/auth/redefinir-senha', { method: 'POST', body: { token, senha: formulario.senha.value } });
        formulario.reset();
        formulario.querySelector('button').disabled = true;
        mostrar(d.mensagem + ' ', false);
        const link = document.createElement('a');
        link.href = '/login.html';
        link.textContent = 'Ir para o login';
        aviso.append(link);
      } catch (erro) {
        mostrar(erro.message, true);
      }
    });
  </script>
</body>
</html>
