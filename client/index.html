<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusLost – Achados e Perdidos</title>
  <link rel="icon" href="/img/undb.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a class="marca" href="/">CampusLost</a>
    <nav>
      <a href="/itens.html">Itens encontrados</a>
      <a href="/novo-item.html">Registrar item</a>
      <a href="/minhas-reivindicacoes.html">Minhas reivindicações</a>
      <a href="/admin.html">Administração</a>
      <a href="/login.html" id="sair">Sair</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="fundo-acesso" aria-hidden="true">
        <div class="mancha mancha-1"></div>
        <div class="mancha mancha-2"></div>
        <svg class="setas setas-1" viewBox="0 0 220 120"><polyline points="4,6 64,60 4,114"/><polyline points="74,6 134,60 74,114"/><polyline points="144,6 204,60 144,114"/></svg>
      </div>
      <h1>Perdeu algo no <span>campus</span>?</h1>
      <p>Encontre objetos perdidos ou ajude alguém a recuperar o que perdeu.</p>

      <form class="busca" action="/itens.html" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
        </svg>
        <input type="search" name="q" placeholder="Buscar mochila, documento, chave..." aria-label="Buscar itens">
      </form>

      <div class="acoes">
        <a class="botao botao-claro" href="/itens.html">Ver itens encontrados</a>
        <a class="botao botao-destaque" href="/novo-item.html">Registrar item</a>
      </div>
    </section>

    <section class="cartao">
      <h2>Últimos itens cadastrados</h2>
      <div class="grade-itens" id="ultimos"></div>
      <p class="suave" id="ultimos-vazio" hidden>Nenhum item cadastrado ainda.</p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/menu.js"></script>
  <script>
    // Últimos itens disponíveis (RF03.1)
    const rotulos = {
      AGUARDANDO_RECEBIMENTO: 'Aguardando recebimento',
      DISPONIVEL: 'Disponível',
      EM_REIVINDICACAO: 'Em reivindicação',
      DEVOLVIDO: 'Devolvido',
    };

    api('/itens?limite=4')
      .then(mostrarItens)
      .catch(() => mostrarItens([]));

    function mostrarItens(itens) {
      const grade = document.getElementById('ultimos');
      document.getElementById('ultimos-vazio').hidden = itens.length > 0;

      for (const item of itens) {
        const cartao = document.createElement('a');
        cartao.className = 'item';
        cartao.href = `/item.html?id=${item.id}`;

        // Sem foto: um quadro "Sem foto" no lugar de uma imagem quebrada
        const foto = document.createElement(item.foto ? 'img' : 'div');
        foto.className = 'item-foto';
        if (item.foto) {
          foto.src = item.foto;
          foto.alt = '';
        }
        const titulo = document.createElement('h3');
        titulo.textContent = item.titulo;
        const local = document.createElement('p');
        local.textContent = item.local;
        const selo = document.createElement('span');
        selo.className = `selo selo-${item.status.toLowerCase()}`;
        selo.textContent = rotulos[item.status];

        cartao.append(foto, titulo, local, selo);
        grade.append(cartao);
      }
    }
  </script>
</body>
</html>
