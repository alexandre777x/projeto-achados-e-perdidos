<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – CampusLost</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a class="marca" href="/">CampusLost</a>
    <nav>
      <a href="/itens.html">Itens encontrados</a>
      <a href="/novo-item.html">Registrar item</a>
      <a href="/minhas-reivindicacoes.html">Minhas reivindicações</a>
      <a href="/admin.html">Administração</a>
      <a href="/login.html">Entrar</a>
    </nav>
  </header>

  <main>
    <form class="cartao cartao-estreito" id="formulario" novalidate>
      <h1>Entrar</h1>
      <p class="suave">Use o e-mail institucional e a senha da sua conta.</p>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required autocomplete="email" autofocus>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required autocomplete="current-password">

      <p id="aviso" class="erro" role="alert"></p>
      <button type="submit" class="botao-largo">Entrar</button>

      <p class="links-login">
        <a href="/esqueci-senha.html">Esqueci minha senha</a>
        <a href="/cadastro.html">Criar conta</a>
      </p>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/menu.js"></script>
  <script>
    // RF01.3: login por e-mail e senha
    const formulario = document.getElementById('formulario');
    const aviso = document.getElementById('aviso');

    // Volta para a página que pediu o login (só caminhos deste site)
    function destino() {
      const voltar = new URLSearchParams(location.search).get('voltar') || '/';
      return voltar.startsWith('/') && !voltar.startsWith('//') ? voltar : '/';
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      aviso.textContent = '';

      if (!formulario.email.value.trim() || !formulario.senha.value) {
        aviso.textContent = 'Informe o e-mail e a senha.';
        return;
      }

      const botao = formulario.querySelector('button');
      botao.disabled = true;
      botao.textContent = 'Entrando...';
      try {
        await api('/auth/login', {
          method: 'POST',
          body: { email: formulario.email.value.trim(), senha: formulario.senha.value },
        });
        location.href = destino();
      } catch (erro) {
        aviso.textContent = erro.message;
        formulario.senha.value = '';
        formulario.senha.focus();
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
