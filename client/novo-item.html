<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar item encontrado – CampusLost</title>
  <link rel="icon" href="/img/undb.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a class="marca" href="/">CampusLost</a>
    <nav>
      <a href="/itens.html">Itens encontrados</a>
      <a href="/novo-item.html">Registrar item</a>
      <a href="/minhas-reivindicacoes.html">Minhas reivindicações</a>
      <a href="/admin.html">Administração</a>
      <a href="/login.html" id="sair">Sair</a>
    </nav>
  </header>

  <main>
    <h1>Registrar item encontrado</h1>
    <form class="cartao" id="formulario" novalidate>
      <label for="titulo">Título</label>
      <input type="text" id="titulo" name="titulo" required minlength="3" maxlength="80"
             placeholder="Ex.: Garrafa térmica azul">

      <label for="descricao">Descrição</label>
      <textarea id="descricao" name="descricao" rows="4" required maxlength="1000"
                placeholder="Cor, marca, estado. Não conte detalhes que só o dono saberia: eles servem para conferir quem reivindica."></textarea>

      <div class="acoes">
        <div>
          <label for="categoriaId">Categoria</label>
          <select id="categoriaId" name="categoriaId" required>
            <option value="">Escolha...</option>
          </select>
        </div>
        <div>
          <label for="dataAchado">Data em que foi encontrado</label>
          <input type="date" id="dataAchado" name="dataAchado" required>
        </div>
      </div>

      <label for="local">Onde foi encontrado</label>
      <input type="text" id="local" name="local" required minlength="3" maxlength="150"
             placeholder="Ex.: banco em frente à cantina; Bloco A, sala 104, embaixo da mesa">
      <p class="suave dica-campo">Use um ponto de referência que ajude o dono a reconhecer o lugar.</p>

      <label for="fotos">Fotos (de 1 a 3, JPG ou PNG, até 5 MB cada)</label>
      <input type="file" id="fotos" name="fotos" accept="image/jpeg,image/png" multiple required>

      <p id="aviso" role="alert"></p>
      <button type="submit">Registrar item</button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/menu.js"></script>
  <script>
    // RF02.1 a RF02.5: registro de item encontrado
    const MAX_FOTOS = 3;
    const TAMANHO_MAXIMO = 5 * 1024 * 1024;
    const formulario = document.getElementById('formulario');
    const aviso = document.getElementById('aviso');

    function mostrar(texto, ehErro) {
      aviso.textContent = texto;
      aviso.className = ehErro ? 'erro' : '';
    }

    // RF02.4: o calendário não deixa escolher data futura
    function hoje() {
      const agora = new Date();
      return new Date(agora.getTime() - agora.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }
    formulario.dataAchado.max = hoje();
    formulario.dataAchado.value = hoje();

    // RF02.3: as categorias vêm da lista da administração; o local é escrito por quem achou
    api('/referencias/categorias')
      .then((categorias) => {
        for (const c of categorias) formulario.categoriaId.append(new Option(c.nome, c.id));
      })
      .catch((erro) => mostrar(erro.message, true));

    function conferirFotos(fotos) {
      if (fotos.length === 0) return 'Anexe pelo menos uma foto do item.';
      if (fotos.length > MAX_FOTOS) return `Anexe no máximo ${MAX_FOTOS} fotos.`;
      for (const foto of fotos) {
        if (!['image/jpeg', 'image/png'].includes(foto.type)) return `${foto.name} não é JPG nem PNG.`;
        if (foto.size > TAMANHO_MAXIMO) return `${foto.name} passa de 5 MB.`;
      }
      return null;
    }

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      mostrar('');

      if (formulario.titulo.value.trim().length < 3) return mostrar('O título precisa ter pelo menos 3 caracteres.', true);
      if (!formulario.descricao.value.trim()) return mostrar('Descreva o item.', true);
      if (!formulario.categoriaId.value) return mostrar('Escolha uma categoria.', true);
      if (formulario.local.value.trim().length < 3) return mostrar('Descreva onde o item foi encontrado.', true);
      if (!formulario.dataAchado.value) return mostrar('Informe a data em que o item foi encontrado.', true);
      if (formulario.dataAchado.value > hoje()) return mostrar('A data do achado não pode ser futura.', true);
      const problemaNasFotos = conferirFotos([...formulario.fotos.files]);
      if (problemaNasFotos) return mostrar(problemaNasFotos, true);

      const botao = formulario.querySelector('button');
      botao.disabled = true;
      botao.textContent = 'Enviando...';
      try {
        const item = await api('/itens', { method: 'POST', body: new FormData(formulario) });
        formulario.reset();
        formulario.dataAchado.value = hoje();
        mostrar(item.status === 'DISPONIVEL'
          ? `Item nº ${item.id} registrado e já disponível na busca.`
          : `Item nº ${item.id} registrado. Leve o objeto à segurança do campus: ele aparece na busca depois que a administração confirmar o recebimento.`,
          false);
      } catch (erro) {
        mostrar(erro.message, true);
      }
      botao.disabled = false;
      botao.textContent = 'Registrar item';
    });
  </script>
</body>
</html>
