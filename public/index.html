<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusLost – Achados e Perdidos</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a class="marca" href="/">CampusLost</a>
    <nav>
      <a href="/itens.html">Itens encontrados</a>
      <a href="/novo-item.html">Registrar item</a>
      <a href="/minhas-reivindicacoes.html">Minhas reivindicações</a>
      <a href="/admin.html">Administração</a>
      <a href="/login.html">Entrar</a>
    </nav>
  </header>

  <main>
    <div class="cartao">
      <h1>Achados e perdidos do campus</h1>
      <p>Registre o que você encontrou, procure o que perdeu e reivindique a posse.</p>
      <a class="botao" href="/itens.html">Ver itens encontrados</a>
    </div>

    <p class="suave" id="status">Verificando o servidor...</p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // Teste de ligação entre front-end, back-end e banco. Pode ser removido depois.
    api('/saude')
      .then((d) => {
        document.getElementById('status').textContent = `Servidor ok. Tabelas no banco: ${d.tabelas}.`;
      })
      .catch(() => {
        const el = document.getElementById('status');
        el.textContent = 'Não foi possível falar com o servidor.';
        el.classList.add('erro');
      });
  </script>
</body>
</html>
