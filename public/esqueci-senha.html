<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esqueci minha senha – CampusLost</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a class="marca" href="/">CampusLost</a>
    <nav>
      <a href="/itens.html">Itens encontrados</a>
      <a href="/novo-item.html">Registrar item</a>
      <a href="/minhas-reivindicacoes.html">Minhas reivindicações</a>
      <a href="/admin.html">Administração</a>
      <a href="/login.html">Entrar</a>
    </nav>
  </header>

  <main>
    <h1>Esqueci minha senha</h1>
    <form class="cartao" id="formulario">
      <p class="suave">Informe o e-mail da sua conta. Enviaremos um link para criar uma nova senha.</p>
      <label for="email">E-mail institucional</label>
      <input type="email" id="email" name="email" required autocomplete="email">
      <button type="submit">Enviar link</button>
      <p id="aviso" role="status"></p>
    </form>
    <p><a href="/login.html">Voltar para o login</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // RF01.6: pede o link de recuperação
    const formulario = document.getElementById('formulario');
    const aviso = document.getElementById('aviso');

    formulario.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const botao = formulario.querySelector('button');
      botao.disabled = true;
      aviso.className = '';
      try {
        const d = await api('/auth/recuperar-senha', { method: 'POST', body: { email: formulario.email.value } });
        aviso.textContent = d.mensagem;
      } catch (erro) {
        aviso.textContent = erro.message;
        aviso.className = 'erro';
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
